name: Gerar narração

# Gera a narração dos Reels narrados (voz neural, sem custo) e o tempo de cada palavra,
# para a legenda palavra por palavra. Saída: kit/voz/<nome>.mp3 e kit/voz/<nome>.json
# Usado pelo Claude, porque o ambiente dele não acessa o serviço de voz.
on:
  workflow_dispatch:
    inputs:
      nome:
        description: 'Nome do arquivo (sem extensão), ex.: caber'
        required: true
      texto:
        description: 'Texto da narração'
        required: true
      voz:
        description: 'Voz'
        required: false
        default: 'pt-BR-AntonioNeural'
      ritmo:
        description: 'Velocidade, ex.: -8%'
        required: false
        default: '-8%'
      tom:
        description: 'Tom, ex.: -2Hz'
        required: false
        default: '-2Hz'

permissions:
  contents: write

concurrency:
  group: gerar-voz
  cancel-in-progress: false

jobs:
  voz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Gerar
        env:
          NOME: ${{ github.event.inputs.nome }}
          TEXTO: ${{ github.event.inputs.texto }}
          VOZ: ${{ github.event.inputs.voz }}
          RITMO: ${{ github.event.inputs.ritmo }}
          TOM: ${{ github.event.inputs.tom }}
        run: |
          case "$NOME" in *[!a-z0-9-]*|'') echo "Nome inválido"; exit 1;; esac
          pip install -q edge-tts
          mkdir -p kit/voz
          python - <<'PY'
          import asyncio, json, os, edge_tts
          nome, texto = os.environ['NOME'], os.environ['TEXTO']
          async def main():
              try:
                  c = edge_tts.Communicate(texto, os.environ['VOZ'], rate=os.environ['RITMO'], pitch=os.environ['TOM'], boundary='WordBoundary')
              except TypeError:
                  c = edge_tts.Communicate(texto, os.environ['VOZ'], rate=os.environ['RITMO'], pitch=os.environ['TOM'])
              palavras = []
              with open(f'kit/voz/{nome}.mp3', 'wb') as f:
                  async for ch in c.stream():
                      if ch['type'] == 'audio':
                          f.write(ch['data'])
                      elif ch['type'] == 'WordBoundary':
                          palavras.append({'palavra': ch['text'], 'inicio': ch['offset'] / 1e7, 'duracao': ch['duration'] / 1e7})
              json.dump({'texto': texto, 'voz': os.environ['VOZ'], 'palavras': palavras}, open(f'kit/voz/{nome}.json', 'w'), ensure_ascii=False, indent=1)
              print(len(palavras), 'palavras')
          asyncio.run(main())
          PY
          git config user.name "verdades-bot"
          git config user.email "actions@users.noreply.github.com"
          git add kit/voz
          git commit -m "Narração $NOME"
          git pull --rebase -q
          git push
