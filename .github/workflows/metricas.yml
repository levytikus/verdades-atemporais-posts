name: Coletar métricas

on:
  schedule:
    - cron: '17 9 * * 1,2'   # segunda e terça, 6h17 em Brasília (antes do lote semanal)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  metricas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Coletar
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          IG_USER_ID: ${{ vars.IG_USER_ID }}
        run: python metricas.py
      - name: Gravar
        run: |
          if [ -n "$(git status --porcelain metricas.json)" ]; then
            git config user.name "verdades-bot"
            git config user.email "actions@users.noreply.github.com"
            git add metricas.json
            git commit -m "Métricas de $(date -u +%F)"
            git pull --rebase -q || true
            git push
          fi
