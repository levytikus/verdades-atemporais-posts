name: Baixar trilha sonora

# Baixa uma trilha livre de direitos (gerada para a página) e guarda em kit/musicas como MP3.
# Usado pelo Claude, porque o ambiente dele não acessa o endereço de download.
on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Endereço do arquivo de áudio'
        required: true
      nome:
        description: 'Nome do arquivo (sem extensão), ex.: piano-reflexivo'
        required: true

permissions:
  contents: write

jobs:
  baixar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Baixar e converter
        env:
          URL: ${{ github.event.inputs.url }}
          NOME: ${{ github.event.inputs.nome }}
        run: |
          case "$NOME" in *[!a-z0-9-]*|'') echo "Nome inválido"; exit 1;; esac
          mkdir -p kit/musicas
          curl -fsSL "$URL" -o /tmp/trilha
          ffmpeg -loglevel error -y -i /tmp/trilha -ac 2 -ar 48000 -b:a 192k "kit/musicas/$NOME.mp3"
          git config user.name "verdades-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "kit/musicas/$NOME.mp3"
          git commit -m "Trilha $NOME"
          git pull --rebase -q
          git push
